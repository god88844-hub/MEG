name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Protected-Path & Test Integrity Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject test deletions and weakened assertions
        shell: bash
        run: |
          BASE_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
          fi
          if [ -z "$BASE_REF" ]; then
            echo "No base commit for diff; skipping guard."
            exit 0
          fi
          DELETED=$(git diff --diff-filter=D --name-only "$BASE_REF..HEAD" | grep -E '(^|/)tests/|^meg-plane/test/|^meg-eval/test_' || true)
          if [ -n "$DELETED" ]; then
            echo "::error::Unauthorized deletion of protected test path(s): $DELETED"
            exit 1
          fi
          WEAKENED=$(git diff "$BASE_REF..HEAD" -- 'meg-rs/crates/*/tests/*' 'meg-eval/test_*.py' | grep -E '^\+\s*(#\[ignore\]|@pytest\.mark\.skip|return\s+#\s*skip)' || true)
          if [ -n "$WEAKENED" ]; then
            echo "::error::Suspicious test-skip/ignore weakening detected:"
            echo "$WEAKENED"
            exit 1
          fi
          echo "Protected-path and assertion integrity guard passed."

  rust-unix:
    name: Pure-Rust Single Binary (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime configuration
        run: echo "MEG_CONFIG_DIR=${RUNNER_TEMP}/meg-test-config" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Strict zero-warning clippy
        working-directory: meg-rs
        run: cargo clippy --locked --no-deps --workspace -- -D warnings
      - name: Rust workspace tests (--locked)
        working-directory: meg-rs
        run: cargo test --locked --workspace
      - name: Standalone single-binary release build
        working-directory: meg-rs
        run: cargo build --locked --release -p meg-cli
      - name: Verify standalone binary
        run: ./meg-rs/target/release/meg --version

  windows:
    name: Windows Full Gate (Rust + Python Evals + Legacy Bun)
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime configuration
        run: '"MEG_CONFIG_DIR=$env:RUNNER_TEMP\meg-test-config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Export GNU linker
        shell: msys2 {0}
        run: cygpath -w /mingw64/bin >> "$GITHUB_PATH"
      - name: Install native Rust toolchain + clippy
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu
      - name: Strict zero-warning clippy
        working-directory: meg-rs
        run: cargo clippy --locked --no-deps --workspace -- -D warnings
      - name: Rust workspace tests (--locked)
        working-directory: meg-rs
        run: cargo test --locked --workspace
      - name: Native release build
        working-directory: meg-rs
        run: cargo build --locked --release --workspace
      - name: Verify standalone pure-Rust binary (zero Bun)
        run: ./meg-rs/target/release/meg.exe --version
      - name: Python offline evaluation suite
        run: |
          python -m pip install --upgrade pytest
          python -m pytest meg-eval -q
      - name: Legacy Bun control-plane compatibility suite
        working-directory: meg-plane
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test --timeout 20000
          bun build src/index.ts --target=bun --outfile=dist/plane.js
